<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iMessage Private Chat</title>
  <link rel="stylesheet" href="/signal.css">
</head>
<body>
  <div id="chat-wrapper">
    <header>
      <h2>Private Chat</h2>
      <span>iMessage Style</span>
    </header>

    <div id="messages"></div>

    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="iMessage" autocomplete="off" required />
      <button id="send-btn" type="submit">↑</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const messages = document.getElementById('messages');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');

    // Prompt for user's name
    const sender = prompt("Enter your name:") || "Anonymous";

    // Load message history
    socket.on('load history', (history) => {
      messages.innerHTML = '';
      history.forEach(msg => appendMessage(msg));
    });

    // Receive message
    socket.on('chat message', (msg) => {
      appendMessage(msg);
    });

    // Send message
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value.trim()) {
        const msgData = { sender, text: input.value.trim() };
        socket.emit('chat message', msgData);
        input.value = '';
      }
    });

    function appendMessage(data) {
      const item = document.createElement('div');
      const isMe = data.sender === sender;
      item.classList.add('message', isMe ? 'sent' : 'received');

      item.innerHTML = `
        ${!isMe ? `<div class="sender-name">${data.sender}</div>` : ''}
        <div>${data.text}</div>
      `;

      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
